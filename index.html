<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>首頁 - 我的多頁面網站</title>
    <style>
        /* 共用基礎樣式 */
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f4f7f6; color: #333; line-height: 1.6; }
        header { background: #333; color: white; padding: 20px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 20px; font-weight: bold; }
        
        /* 導覽列：注意 href 串聯了不同的 html 檔案 */
        nav a { color: white; text-decoration: none; margin-left: 20px; font-weight: bold; }
        nav a:hover, nav a.active { color: #1abc9c; }
        
        .container { max-width: 800px; margin: 50px auto; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        h1 { color: #2c3e50; }
        footer { text-align: center; padding: 20px; color: #777; font-size: 14px; }
    </style>
</head>
<body>

    <header>
        <div class="logo">多頁面站點 5.0</div>
        <nav>
            <a href="index.html" class="active">首頁</a>
            <a href="about.html">關於我們</a>
            <a href="contact.html">聯絡我們</a>
        </nav>
    </header>

    <div class="container">
        <h1>🏠 歡迎來到我們的官方首頁</h1>
        <p>這是一個多網頁（Multi-Page Application）的範例。點擊上方導覽列的連結，瀏覽器會直接切換並載入不同的 HTML 檔案，但整體設計風格依舊保持一致。</p>
        <p>目前你正在閱讀的是 <strong>index.html</strong>。</p>
    </div>

    <footer>&copy; 2026 多頁面網站範例.</footer>

</body>
</html>
