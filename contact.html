<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聯絡我們 - 網頁 7.0 雲端版</title>
    <!-- 引入外部共用 CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">🚀 Cloud Project 7.0</div>
        <nav>
            <a href="index.html">首頁</a>
            <a href="about.html">關於我們</a>
            <a href="contact.html" class="active">聯絡我們</a>
        </nav>
    </header>

    <div class="container" style="max-width: 600px;">
        <h1>✉️ 聯絡我們</h1>
        <p style="margin-bottom: 30px;">填寫下方表單，體驗與共用樣式表完美融合的網頁 UI 設計。</p>
        
        <form onsubmit="alert('🎉 訊息已成功透過雲端系統模擬送出！'); this.reset(); return false;">
            <div class="form-group">
                <label for="email">電子郵件地址</label>
                <input type="email" id="email" required placeholder="example@email.com">
            </div>
            
            <div class="form-group">
                <label for="message">您想對我們說的話</label>
                <textarea id="message" rows="5" required placeholder="請輸入留言內容..."></textarea>
            </div>
            
            <button type="submit" class="submit-btn">提交表單</button>
        </form>
    </div>

    <footer>&copy; 2026 雲端部署版權所有.</footer>

</body>
</html>
