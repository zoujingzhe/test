<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聯絡我們 - 網頁 6.0 工程版</title>
    <!-- 引入全站共用 CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">🚀 Project 6.0</div>
        <nav>
            <a href="index.html">首頁</a>
            <a href="about.html">關於我們</a>
            <a href="contact.html" class="active">聯絡我們</a>
        </nav>
    </header>

    <div class="container" style="max-width: 600px;"> <!-- 縮小表單容器寬度，視覺更集中 -->
        <h1>✉️ 聯絡我們</h1>
        <p style="margin-bottom: 30px;">如果您有任何合作意向或技術疑問，請填寫下方表單，我們將儘快回覆您。</p>
        
        <!-- 表單主體 -->
        <form onsubmit="alert('🎉 訊息已透過 6.0 系統模擬送出！'); this.reset(); return false;">
            <div class="form-group">
                <label for="email">電子郵件地址</label>
                <input type="email" id="email" required placeholder="example@email.com">
            </div>
            
            <div class="form-group">
                <label for="message">您想說的話</label>
                <textarea id="message" rows="5" required placeholder="請輸入您的留言內容..."></textarea>
            </div>
            
            <button type="submit" class="submit-btn">提交表單</button>
        </form>
    </div>

    <footer>&copy; 2026 外部樣式架構模組.</footer>

</body>
</html>
